<!-- @dsCard group="Layout" height=880 -->
<body style="padding:16px">
<div id="m" style="display:flex;flex-direction:column;gap:20px;max-width:340px;text-align:center"></div>
<script>
var K = window.DailyKit, m = document.getElementById('m');
function row(logoId, end) {
  var g = logoId && K.GAMES.filter(function (x) { return x.id === logoId; })[0];
  var w = document.createElement('div');
  if (g) w.style.setProperty('--accent', 'var(--' + g.token + ')');
  if (logoId) w.appendChild(K.GameLogo(logoId));
  var e = document.createElement('div'); e.style.marginTop = '4px'; e.appendChild(K.EndScreen(end));
  w.appendChild(e); m.appendChild(w);
}
row(null, { tier: 'Excellent', detail: 'Cleared the board in 6 moves.', score: 1280 });
row('rotate-lock', { tier: 'Excellent', detail: 'Opened the lock at par, 9 moves.' });
row('difference-relay', { tier: 'Rough', detail: 'Out of runs. Best run reached station 4 of 6.' });
row('word-ladder', { tier: 'Excellent', detail: 'Climbed in 4 rungs, par 4' });
row('word-ladder', { tier: 'Rough', detail: 'Revealed, par 4' });
row('pangram', { tier: 'Excellent', detail: 'Found 21 of 21 words, 63 of 63 points, pangram found' });
row('five-letters', { tier: 'Great', detail: 'Solved in 3' });
row('five-letters', { tier: 'Rough', detail: 'Not solved. The word was HEART' });
</script>
</body>
