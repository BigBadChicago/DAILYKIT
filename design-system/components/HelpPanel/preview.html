<!-- @dsCard group="Chrome" height=1560 -->
<body style="padding:16px">
<div id="m" style="display:flex;flex-direction:column;gap:20px;max-width:380px"></div>
<script>
var K = window.DailyKit, m = document.getElementById('m');
function card(title, help) {
  var wrap = document.createElement('div');
  var h = document.createElement('p');
  h.style.cssText = 'margin:0 0 6px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim)';
  h.textContent = title;
  wrap.appendChild(h);
  wrap.appendChild(K.HelpPanel(help));
  m.appendChild(wrap);
}
card('POKER GRID', {
  headline: 'Clear five connected cards that form a poker hand.',
  steps: ['Tap five cards that touch.', 'A valid hand clears them.', 'Clear the whole board.'],
  example: { lines: ['A♠ K♠ Q♠ J♠ 10♠', 'Royal flush'], caption: 'Five spades in a row: a valid hand.' }
});
card('ROTATE LOCK — ROTATE-LOCK.md §19, four steps, a three-piece route', {
  headline: 'Order and rotate the route pieces so the path takes every marked turn and ends at the lock.',
  steps: [
    'The tray holds seven route pieces. Each is a straight arrow one, two or three cells long.',
    'The route leaves the start and follows the pieces in tray order.',
    'Swap any two pieces, or rotate one a quarter turn. Each is one move.',
    'The lock opens when the route turns at every marked cell and ends on the lock.'
  ],
  example: { lines: ['S → → v', 'v → L'], caption: 'Three pieces, two marked turns: right twice, down, right, into the lock.' }
});
card('DIFFERENCE RELAY — DIFFERENCE-RELAY.md §19, five steps, a four-station relay from two runs', {
  headline: 'Order the numbers so every neighbouring pair differs by the amount marked between them.',
  steps: [
    'Six stations hold numbers one to six, in some order.',
    'Some of the five gaps between them show the difference between neighbours; some are hidden.',
    'Swap two stations, then run the relay.',
    'The baton walks from station one as long as each pair keeps its marked difference.',
    'Six runs. Read where the baton stopped to infer a hidden gap before your next run.'
  ],
  example: { lines: ['Run 1: 3 1 4 2 — baton reaches station 3 of 4', 'Run 2: 3 1 2 4 — baton reaches station 4: open'], caption: 'The first run’s stop told them station 3–4 was wrong; swapping it opened the relay.' }
});

card('WORD LADDER \u2014 src/games/word-ladder/help.ts, five steps', {
  headline: 'Change one letter at a time to climb from the start word to the goal word in as few steps as you can.',
  steps: [
    'You start on the top word and climb toward the goal word shown below it.',
    'Each step changes exactly one letter, and every step must be a real four letter word.',
    'The shortest possible climb is par. Match it for the best result.',
    'Tap a letter tile then a key to change it, or type the whole word and press Enter.',
    'Stuck? Reveal shows one shortest climb and ends today\u2019s ladder.'
  ],
  example: { lines: ['cold, then cord, then word, then ward, then warm', 'four steps, one letter changed each time'], caption: 'COLD to WARM in four steps: COLD, CORD, WORD, WARD, WARM. Each step changes one letter into a real word.' }
});
card('PANGRAM \u2014 src/games/pangram/help.ts, five steps', {
  headline: 'Make words of four or more letters from the seven, always using the centre letter, and find the word that uses all seven.',
  steps: [
    'Tap letters to spell a word, or type it, then press Enter. Letters may repeat.',
    'Every word needs at least four letters and must include the centre letter.',
    'A word scores one point for each letter past three. A word using all seven letters is a pangram and scores seven more.',
    'Your rank rises as your score grows. The top rank needs a pangram.',
    'Finish whenever you like to end the day and see every word you missed.'
  ],
  example: { lines: ['bath, 1 point', 'habit, 2 points', 'habitation, a pangram, 14 points', 'tint is refused: no centre letter'], caption: 'Letters A B I N O T with H in the centre: BATH scores 1, HABIT scores 2, and HABITATION uses all seven, scoring 7 plus 7.' }
});
card('FIVE LETTERS \u2014 src/games/five-letters/help.ts, four steps', {
  headline: 'Find the five letter word in six guesses, each letter marked right, present or absent.',
  steps: [
    'Type a five letter word, or tap the letter keys, then press Enter.',
    'Right means the letter is in that position. Present means the word has it elsewhere. Absent means no more copies.',
    'A letter is marked right or present only as many times as the word holds it, and exact matches are marked first.',
    'The keyboard remembers the best mark each letter has earned.'
  ],
  example: { lines: ['T absent', 'R present', 'E present', 'A present', 'T right'], caption: 'The word is HEART. Guessing TREAT: the last T is right, so the first T is absent; R, E and A are present.' }
});
</script>
</body>
