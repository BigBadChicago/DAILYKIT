<body style="padding:16px">
<div id="m" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:420px;text-align:center;font:12px var(--font-sans);color:var(--text-dim)"></div>
<script>
var K=window.DailyKit,m=document.getElementById('m');
["home","help","stats","archive","theme-system","theme-light","theme-dark","close"].forEach(function(name){
  var cell=document.createElement('div');
  var btn=document.createElement('button');btn.className='dk-iconbutton';btn.style.margin='0 auto';btn.setAttribute('aria-label',K.ICON_LABEL[name]);
  btn.appendChild(K.Icon(name));
  cell.appendChild(btn);
  var label=document.createElement('div');label.style.marginTop='4px';label.textContent=name;
  cell.appendChild(label);
  m.appendChild(cell);
});
</script>
</body>
