name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tools
      # The worker has its own program, because the WebWorker lib cannot share
      # one with DOM. Without this line it is typechecked nowhere.
      - run: npm run typecheck:sw
      - run: npm run depcheck
      - run: npm test
      # Section 10.5. The committed manifest is checked on every change to the
      # rules, the scoring table, or the generator, because all three can
      # silently invalidate boards that were correct when they were written.
      - run: npm run poker-grid:verify
      # The same check for game two. Separate from generation on purpose: a bug
      # that writes a bad day and a bug that fails to notice one must not be
      # able to be the same bug.
      - run: npm run cipher:verify
      # Game three. VECTOR's verifier existed from its first phase and CI never
      # ran it, so a change could invalidate its horizon without failing a
      # build. The uniqueness search makes this the slowest step, about 100
      # seconds, and it stays in CI anyway.
      - run: npm run vector:verify
      # Game four, ROTATE LOCK. Its search enumerates arrangements by piece id
      # without the game's solver, about 55 seconds. The certify test requires a
      # live game's verifier to run before the certify step, so it is here from
      # the change that adds the game rather than the change that makes it live.
      - run: npm run rotate-lock:verify
      # Game five, DIFFERENCE RELAY. Its check enumerates all 720 orders and
      # replays the no guess deduction, sharing no code with the game's solver.
      # Here from the change that adds the game rather than the one that makes it
      # live, so the certify test finds the verifier before the certify step.
      - run: npm run difference-relay:verify
      # Phase 10. The release build is the only build that produces the shared
      # engine chunk, so a change that breaks bundling must fail here rather
      # than at deploy time.
      - run: npm run build
      # Constraint 2.7's byte half. The build has to have run first, because
      # this reads dist/ and sums what each page actually references.
      - run: npm run budget
      # ARCHITECTURE2 section 45. Last on purpose: --from-ci records the npm
      # steps above as passed, which is only true because a failing step stops
      # the job before reaching this one. It still checks every file itself,
      # refuses any live game that is not production safe today, and fails if a
      # committed data/<game>/certification.json no longer matches the gate.
      - run: npm run certify -- --check --from-ci
