name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tools
      # The worker has its own program, because the WebWorker lib cannot share
      # one with DOM. Without this line it is typechecked nowhere.
      - run: npm run typecheck:sw
      - run: npm run depcheck
      - run: npm test
      # Section 10.5. The committed manifest is checked on every change to the
      # rules, the scoring table, or the generator, because all three can
      # silently invalidate boards that were correct when they were written.
      - run: npm run poker-grid:verify
      # Phase 10. The release build is the only build that produces the shared
      # engine chunk, so a change that breaks bundling must fail here rather
      # than at deploy time.
      - run: npm run build
      # Constraint 2.7's byte half. The build has to have run first, because
      # this reads dist/ and sums what each page actually references.
      - run: npm run budget
